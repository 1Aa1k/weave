<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="weave">
  <!-- Indigo threads interlaced over-under with parchment threads: the site's own two inks. -->
  <g stroke-width="6" stroke-linecap="round" fill="none">
    <!-- vertical indigo threads -->
    <path d="M17 6 v6" stroke="#8db4e2"/>
    <path d="M17 22 v20" stroke="#8db4e2"/>
    <path d="M31 6 v20" stroke="#8db4e2"/>
    <path d="M31 36 v6" stroke="#8db4e2"/>
    <!-- horizontal parchment threads -->
    <path d="M6 17 h20" stroke="#e9e3d3"/>
    <path d="M36 17 h6" stroke="#e9e3d3"/>
    <path d="M6 31 h6" stroke="#e9e3d3"/>
    <path d="M22 31 h20" stroke="#e9e3d3"/>
  </g>
</svg>
